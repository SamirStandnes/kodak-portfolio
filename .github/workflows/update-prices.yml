name: Daily price update

# Replaces the old Heroku Scheduler job (heroku/scripts/update_prices.py).
# Fetches latest prices + FX from Yahoo Finance and writes them into the
# remote Postgres (Neon) that backs the hosted Streamlit Cloud dashboard.

on:
  schedule:
    # 22:00 UTC on weekdays — after US market close. GitHub may delay cron
    # runs under load; exact timing isn't critical for end-of-day prices.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # update_prices.py only needs psycopg2 + yfinance (no kodak imports).
        run: pip install psycopg2-binary yfinance

      - name: Run daily price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_CURRENCY: NOK
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set yet — skipping until Neon is configured."
            exit 0
          fi
          python heroku/scripts/update_prices.py
