[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Don't dump raw Python tracebacks into the UI. Transient errors during a
# rerun used to flash a wall of red text for a second before the page
# settled; now Streamlit shows a compact message and the full detail still
# goes to the server logs. Flip back to "full" when debugging locally.
showErrorDetails = "none"

# Theme colors are kept in sync with the canonical palette in
# kodak/dashboard/style.py (COLORS). Matching them here means Streamlit's
# native chrome paints in the final colors immediately, so there's no flash
# of a different background before the custom CSS loads.
[theme]
primaryColor = "#667EEA"
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"
